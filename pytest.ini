[pytest]
# asyncio_mode=auto so async test functions need no per-test decorator. The suite
# is almost entirely async (the API layer is), and the alternative is an
# @pytest.mark.asyncio on well over a hundred tests.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short

# So `pytest` works the same as `python -m pytest` -- a bare `pytest` does not
# put the working directory on sys.path, and every test imports `app`.
pythonpath = .

filterwarnings =
    # Surface our own deprecations, but Chroma and its transitive deps emit
    # plenty we can't act on.
    default
    ignore::DeprecationWarning:chromadb.*
    ignore::DeprecationWarning:pydantic.*
    ignore::UserWarning:google.*
